<!DOCTYPE html>
<html lang="en">
<head>

<style>
  .err-wrap {
    min-height: 80vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 8rem var(--gutter) 4rem;
    text-align: center;
  }
  .err-inner { max-width: 640px; }
  .err-ball {
    width: 120px;
    height: 120px;
    margin: 0 auto 1.5rem;
    border-radius: 50%;
    background:
      radial-gradient(circle at 35% 30%, #fff 0%, #f0f0f0 60%, #d8d8d8 100%);
    box-shadow:
      inset -6px -8px 16px rgba(0,0,0,0.12),
      0 12px 32px -8px rgba(0,0,0,0.2);
    position: relative;
  }
  .err-ball::after {
    content: "MG";
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: var(--font-display);
    font-size: 2.5rem;
    font-weight: 700;
    color: var(--green-deep);
    letter-spacing: 0.04em;
  }
  .err-code {
    font-family: var(--font-script);
    font-size: clamp(4rem, 12vw, 8rem);
    line-height: 1;
    color: var(--green-deep);
    margin-bottom: 0.5rem;
  }
  .err-title {
    font-family: var(--font-display);
    font-size: var(--text-2xl);
    text-transform: uppercase;
    color: var(--ink);
    margin-bottom: 1rem;
    letter-spacing: 0.02em;
  }
  .err-body {
    font-family: var(--font-body);
    font-size: var(--text-lg);
    color: var(--text-muted);
    line-height: 1.65;
    margin-bottom: 2rem;
  }
  .err-actions {
    display: flex;
    gap: 0.75rem;
    justify-content: center;
    flex-wrap: wrap;
  }
</style>
</head>
<body>

<header class="z1-header is-scrolled">
  <div class="z1-inner">
    <a class="z1-logo" href="/">
      <img src="/assets/images/logo-wordmark.png" alt="Mulligan's Grille">
    </a>
  </div>
</header>

<main class="err-wrap">
  <div class="err-inner">
    <div class="err-ball" aria-hidden="true"></div>
    <div class="err-code">Mulligan!</div>
    <h1 class="err-title">404 — This page took a mulligan</h1>
    <p class="err-body">That page isn&rsquo;t on the menu. Re-tee and head back to the grill — we&rsquo;ll get you sorted.</p>
    <div class="err-actions">
      <a href="/" class="btn btn-primary">← Back to the grill</a>
      <a href="tel:+13867883268" class="btn btn-ghost">Call (386) 788-3268</a>
    </div>
  </div>
</main>

<footer class="z9-footer">
  <div class="z9-inner">
    <p class="z9-bottom">&copy; <span class="js-footer-year">2026</span> Mulligan&rsquo;s Grille · Port Orange, FL</p>
  </div>
</footer>

<script src="/assets/js/main.js" defer></script>
</body>
</html>
